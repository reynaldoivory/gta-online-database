name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: cd GTA-Vehicle-Database-App && npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            GTA-Vehicle-Database-App/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'GTA-Vehicle-Database-App/package-lock.json') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            GTA-Vehicle-Database-App/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'GTA-Vehicle-Database-App/package-lock.json') }}

      - name: Install dependencies
        run: npm ci && cd GTA-Vehicle-Database-App && npm ci

      - name: Run linter
        run: cd GTA-Vehicle-Database-App && npm run lint || echo "No lint script configured"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            GTA-Vehicle-Database-App/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'GTA-Vehicle-Database-App/package-lock.json') }}

      - name: Install dependencies
        run: npm ci && cd GTA-Vehicle-Database-App && npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: GTA-Vehicle-Database-App/dist/
          retention-days: 7

  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas

      - name: Validate CSV files
        run: |
          python - <<'EOF'
          import pandas as pd
          import sys
          from pathlib import Path

          data_dir = Path('data')
          csv_files = list(data_dir.glob('*.csv'))

          if not csv_files:
              print("Warning: No CSV files found in data directory")
              sys.exit(0)

          errors = []
          for csv_file in csv_files:
              try:
                  print(f"Validating {csv_file.name}...")
                  df = pd.read_csv(csv_file)

                  # Check for empty files
                  if df.empty:
                      errors.append(f"{csv_file.name}: File is empty")
                      continue

                  # Check for required columns (basic validation)
                  if df.columns.empty:
                      errors.append(f"{csv_file.name}: No columns found")
                      continue

                  # Check for duplicate rows
                  duplicates = df.duplicated().sum()
                  if duplicates > 0:
                      print(f"  Warning: {duplicates} duplicate rows found in {csv_file.name}")

                  print(f"  ✓ {csv_file.name}: {len(df)} rows, {len(df.columns)} columns")

              except Exception as e:
                  errors.append(f"{csv_file.name}: {str(e)}")

          if errors:
              print("\nValidation errors:")
              for error in errors:
                  print(f"  ✗ {error}")
              sys.exit(1)
          else:
              print("\n✓ All CSV files validated successfully")
          EOF
